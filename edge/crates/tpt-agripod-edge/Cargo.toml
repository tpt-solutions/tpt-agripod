# SPDX-License-Identifier: MIT OR Apache-2.0

[package]
name = "tpt-agripod-edge"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Edge control loop: sense, estimate, propose, check contracts, actuate, log (Phase 2)."
publish = false

[dependencies]
tpt-agripod-solver = { version = "0.1.0", path = "../tpt-agripod-solver" }
# MQTT link (ADR 0006, corrected by the Phase 3 notes): minimq is sans-IO over embedded-io-async 0.7.
embassy-time = { version = "0.5", features = ["std", "generic-queue-64"] }
embedded-io-adapters = { version = "0.7", features = ["tokio-1"] }
minimq = { version = "0.13.5", default-features = false }
getrandom = "0.3"
tokio = { version = "1", features = ["rt", "net", "time", "macros", "io-util", "sync"] }

[lints]
workspace = true
